  version: "3.8"

  services:
    postgres:
      image: postgres:15
      container_name: finance-postgres
      restart: unless-stopped
      environment:
        POSTGRES_DB: finance
        POSTGRES_USER: finance
        POSTGRES_PASSWORD: finance
      ports:
        - "5432:5432"
      volumes:
        - finance_pg_data:/var/lib/postgresql/data

  volumes:
    finance_pg_data:
