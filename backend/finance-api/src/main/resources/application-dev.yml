spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI:}
  datasource:
    url: jdbc:postgresql://postgres:5432/finance
    username: finance
    password: 123456
    driver-class-name: org.postgresql.Driver
    hikari:
      initialization-fail-timeout: 15000
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        show_sql: true
    open-in-view: false



  task:
    scheduling:
      pool:
        size: 2 # Aynı anda çalışabilecek scheduler sayısı

  scheduler:
    market-price:
      delay-ms: 15000

clients:
  market-data:
    # MDS URL used by MarketDataProxyController and MarketOverviewServiceImpl.
    base-url: ${CLIENTS_MARKET_DATA_BASE_URL:http://localhost:8082}

app:
  expose-internal-errors: true
  security:
    jwt:
      jwk-set-uri: ${JWT_JWK_SET_URI:http://localhost:8085/realms/finance/protocol/openid-connect/certs}
  keycloak:
    admin:
      password: ${KEYCLOAK_ADMIN_PASSWORD:admin}
    portal:
      client-secret: ${KEYCLOAK_PORTAL_CLIENT_SECRET:finance-portal-dev-secret}