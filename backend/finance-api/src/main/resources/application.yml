spring:
  profiles:
    active: dev
  mail:
    host: ${SPRING_MAIL_HOST:smtp.gmail.com}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  servlet:
    multipart:
      max-file-size: 6MB
      max-request-size: 7MB
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI:}
  kafka:
    listener:
      observation-enabled: true
    template:
      observation-enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: http://jaeger:4318/v1/traces

scheduler:
  market-price:
    delay-ms: 60000

app:
  profile-avatar:
    # Repo root /photos (override with PROFILE_AVATAR_STORAGE_ROOT). Local run cwd: backend/finance-api.
    storage-root: ${PROFILE_AVATAR_STORAGE_ROOT:../../photos}
  ai:
    enabled: ${AI_ENABLED:false}
    openai:
      api-key: ${OPENAI_API_KEY:}
      models:
        admin-content: ${OPENAI_MODEL_ADMIN_CONTENT:gpt-4.1-mini}
        translation: ${OPENAI_MODEL_TRANSLATION:gpt-4.1-mini}
  security:
    allow-header-user-fallback: ${APP_SECURITY_ALLOW_HEADER_USER_FALLBACK:true}
  registration:
    enabled: ${APP_REGISTRATION_ENABLED:true}
    verification:
      enabled: ${APP_REGISTRATION_VERIFICATION_ENABLED:true}
      code-length: ${APP_REGISTRATION_VERIFICATION_CODE_LENGTH:6}
      ttl-seconds: ${APP_REGISTRATION_VERIFICATION_TTL_SECONDS:90}
      resend-cooldown-seconds: ${APP_REGISTRATION_VERIFICATION_RESEND_COOLDOWN_SECONDS:15}
      max-attempts: ${APP_REGISTRATION_VERIFICATION_MAX_ATTEMPTS:5}
      hash-secret: ${APP_REGISTRATION_VERIFICATION_HASH_SECRET:change-me}
      from: ${APP_REGISTRATION_VERIFICATION_FROM:${SPRING_MAIL_USERNAME:}}
      subject: ${APP_REGISTRATION_VERIFICATION_SUBJECT:Your Finance Portal verification code}
      portal-public-url: ${APP_PORTAL_PUBLIC_URL:http://localhost:5173}
  keycloak:
    server-url: ${KEYCLOAK_SERVER_URL:http://localhost:8085}
    realm: finance
    admin:
      username: ${KEYCLOAK_ADMIN_USERNAME:admin}
      password: ${KEYCLOAK_ADMIN_PASSWORD:}
      client-id: ${KEYCLOAK_ADMIN_CLIENT_ID:admin-cli}
    portal:
      client-id: ${KEYCLOAK_PORTAL_CLIENT_ID:finance-portal}
      client-secret: ${KEYCLOAK_PORTAL_CLIENT_SECRET:}

# Turkey USD Eurobond ISIN module: Yahoo chart (free) → eurobond_* tables. Configure yahoo-chart-symbol per ISIN (Yahoo ticker, not always equal to ISIN).
market:
  tr-usd-eurobond-yahoo:
    enabled: ${MARKET_TR_USD_EUROBOND_YAHOO_ENABLED:false}
    user-agent: ${MARKET_TR_USD_EUROBOND_YAHOO_USER_AGENT:Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36}
    base-url: ${MARKET_TR_USD_EUROBOND_YAHOO_BASE_URL:https://query1.finance.yahoo.com}
    chart-path-template: ${MARKET_TR_USD_EUROBOND_YAHOO_CHART_PATH:/v8/finance/chart/{symbol}}
    source-provider-id: YAHOO
    trading-timezone: ${MARKET_TR_USD_EUROBOND_YAHOO_TZ:Europe/Istanbul}
    backfill-on-startup: ${MARKET_TR_USD_EUROBOND_YAHOO_BACKFILL_ON_STARTUP:true}
    refresh-cron: ${MARKET_TR_USD_EUROBOND_YAHOO_REFRESH_CRON:0 30 18 * * MON-FRI}
    backfill-range: ${MARKET_TR_USD_EUROBOND_YAHOO_BACKFILL_RANGE:1y}
    catch-up-range: ${MARKET_TR_USD_EUROBOND_YAHOO_CATCHUP_RANGE:1mo}
    interval: ${MARKET_TR_USD_EUROBOND_YAHOO_INTERVAL:1d}
    request-spacing-ms: ${MARKET_TR_USD_EUROBOND_YAHOO_REQUEST_SPACING_MS:400}
    instruments: []
    # Örnek (yahoo-chart-symbol'ü Yahoo Finance grafik URL'sinde doğrulayın; boş ISIN atlanır):
    # instruments:
    #   - isin: US900123AL40
    #     yahoo-chart-symbol: "YOUR_YAHOO_TICKER"