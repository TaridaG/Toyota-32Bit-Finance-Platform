spring:
  profiles:
    active: dev
  mail:
    host: ${SPRING_MAIL_HOST:smtp.gmail.com}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  servlet:
    multipart:
      max-file-size: 6MB
      max-request-size: 7MB
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI:}
  kafka:
    listener:
      observation-enabled: true
    template:
      observation-enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: http://jaeger:4318/v1/traces

scheduler:
  market-price:
    delay-ms: 60000

app:
  security:
    allow-header-user-fallback: ${APP_SECURITY_ALLOW_HEADER_USER_FALLBACK:true}
  registration:
    enabled: ${APP_REGISTRATION_ENABLED:true}
    verification:
      enabled: ${APP_REGISTRATION_VERIFICATION_ENABLED:true}
      code-length: ${APP_REGISTRATION_VERIFICATION_CODE_LENGTH:6}
      ttl-seconds: ${APP_REGISTRATION_VERIFICATION_TTL_SECONDS:90}
      resend-cooldown-seconds: ${APP_REGISTRATION_VERIFICATION_RESEND_COOLDOWN_SECONDS:15}
      max-attempts: ${APP_REGISTRATION_VERIFICATION_MAX_ATTEMPTS:5}
      hash-secret: ${APP_REGISTRATION_VERIFICATION_HASH_SECRET:change-me}
      from: ${APP_REGISTRATION_VERIFICATION_FROM:${SPRING_MAIL_USERNAME:}}
      subject: ${APP_REGISTRATION_VERIFICATION_SUBJECT:Your Finance Portal verification code}
  keycloak:
    server-url: ${KEYCLOAK_SERVER_URL:http://localhost:8085}
    realm: finance
    admin:
      username: ${KEYCLOAK_ADMIN_USERNAME:admin}
      password: ${KEYCLOAK_ADMIN_PASSWORD:}
      client-id: ${KEYCLOAK_ADMIN_CLIENT_ID:admin-cli}
    portal:
      client-id: ${KEYCLOAK_PORTAL_CLIENT_ID:finance-portal}
      client-secret: ${KEYCLOAK_PORTAL_CLIENT_SECRET:}