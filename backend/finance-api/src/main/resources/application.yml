spring:
  profiles:
    active: dev
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: 1.0

otel:
  exporter:
    logging:
      enabled: true

scheduler:
  market-price:
    delay-ms: 60000