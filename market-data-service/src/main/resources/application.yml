spring:
  config:
    import: optional:classpath:application-openapi.yml
  application:
    name: market-data-service
  profiles:
    active: dev
  datasource:
    url: jdbc:h2:mem:marketdata;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    table: mds_flyway_schema_history
    locations: classpath:db/migration
  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    template:
      observation-enabled: true
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

providers:
  binance:
    base-url: https://api.binance.com
  coingecko:
    base-url: https://api.coingecko.com/api/v3
    api-key: ${COINGECKO_API_KEY:}
  fmp:
    enabled: ${PROVIDERS_FMP_ENABLED:false}
    base-url: https://financialmodelingprep.com/api/v3
    api-key: ${FMP_API_KEY:}
  yahoo:
    base-url: https://query1.finance.yahoo.com
    chart-path-template: /v8/finance/chart/{symbol}
    user-agent: Mozilla/5.0 (compatible; FinanceMarketDataService/1.0)
  finnhub:
    enabled: ${PROVIDERS_FINNHUB_ENABLED:false}
    base-url: https://finnhub.io
    stock-quote-path: /api/v1/quote
    stock-candle-path: /api/v1/stock/candle
    stock-profile-path: /api/v1/stock/profile2
    stock-financials-reported-path: /api/v1/stock/financials-reported
    stock-metric-path: /api/v1/stock/metric
    api-key: ${FINNHUB_API_KEY:}

scheduler:
  live:
    # Canlı ingest: günde 3 kez (09:00, 13:00, 17:00 Europe/Istanbul). Override: SCHEDULER_LIVE_CRON
    cron: ${SCHEDULER_LIVE_CRON:0 0 9,13,17 * * *}
    zone: ${SCHEDULER_LIVE_ZONE:Europe/Istanbul}
  # Deprecated: live schedulers artık scheduler.live.cron kullanır (geri dönüş için tutuldu).
  market:
    delay-ms: 30000
  binance:
    delay-ms: 5000
  fx:
    delay-ms: 300000
  stock:
    delay-ms: 60000
  bond:
    delay-ms: 300000

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  tracing:
    sampling:
      probability: ${TRACING_SAMPLE_PROBABILITY:0.1}
  otlp:
    tracing:
      endpoint: http://jaeger:4318/v1/traces

market:
  hot-read-cache:
    enabled: ${MARKET_HOT_READ_CACHE_ENABLED:true}
    prices-ttl-ms: ${MARKET_HOT_READ_CACHE_PRICES_TTL_MS:3000}
    fx-ttl-ms: ${MARKET_HOT_READ_CACHE_FX_TTL_MS:5000}
    pulse-ttl-ms: ${MARKET_HOT_READ_CACHE_PULSE_TTL_MS:30000}
  bank-rates:
    cache-ttl-ms: ${MARKET_BANK_RATES_CACHE_TTL_MS:60000}
    user-agent: Mozilla/5.0 (compatible; FinanceMarketDataService/1.0)
    page-urls:
      USD: https://kur.doviz.com/serbest-piyasa/amerikan-dolari
      EUR: https://kur.doviz.com/serbest-piyasa/euro
      GBP: https://kur.doviz.com/serbest-piyasa/sterlin
      GOLD: https://altin.doviz.com/gram-altin
  evds:
    # TCMB yeni uç (evds2 → 302 / SPA); veri: https://github.com/fatihmete/evds — /igmevdsms-dis/series=...&type=json
    base-url: ${MARKET_EVDS_BASE_URL:https://evds3.tcmb.gov.tr/igmevdsms-dis}
    api-key: ${MARKET_EVDS_API_KEY:${TCMB_API_KEY:}}
    # Politika kartı: EVDS TP_BISPOLFAIZ_TUR (JSON sütunu; istek URL’sinde otomatik TP.BISPOLFAIZ.TUR). Aylık frequency=5.
    policy-rate-series: ${MARKET_EVDS_POLICY_RATE_SERIES:TP_BISPOLFAIZ_TUR}
    # EVDS frequency: 5=aylık. Günlük seri için boş: MARKET_EVDS_POLICY_RATE_FREQUENCY=
    policy-rate-evds-frequency: ${MARKET_EVDS_POLICY_RATE_FREQUENCY:5}
    # Ağırlıklı ortalama TL mevduat faizleri (stok), vade dilimleri — EVDS TP.MT210AGS.TRY.MT01…MT06
    tl-deposit-evds-series:
      - TP.MT210AGS.TRY.MT01
      - TP.MT210AGS.TRY.MT02
      - TP.MT210AGS.TRY.MT03
      - TP.MT210AGS.TRY.MT04
      - TP.MT210AGS.TRY.MT05
      - TP.MT210AGS.TRY.MT06
    tl-deposit-evds-frequency: ${MARKET_EVDS_TL_DEPOSIT_FREQUENCY:5}
    # Kartta gösterilen dilim (MT04 = 1 yıla kadar vadeli)
    tl-deposit-card-maturity: ${MARKET_EVDS_TL_DEPOSIT_CARD_MATURITY:MT04}
    # TÜFE genel endeks (2003=100); aylık/yıllık % değişimler DB'de türetilir
    cpi-index-series: ${MARKET_EVDS_CPI_INDEX_SERIES:TP.FG.J0}
    cpi-evds-frequency: ${MARKET_EVDS_CPI_FREQUENCY:5}
    # 1 hafta vadeli repo kartı (Investing.com repo göstergesi ile uyumlu)
    repo-rate-series: ${MARKET_EVDS_REPO_RATE_SERIES:TP_BISPOLFAIZ_TUR}
    repo-rate-evds-frequency: ${MARKET_EVDS_REPO_RATE_FREQUENCY:5}
  cpi:
    monthly-sync:
      enabled: ${MARKET_CPI_MONTHLY_SYNC_ENABLED:true}
      startup-delay-ms: ${MARKET_CPI_MONTHLY_SYNC_STARTUP_DELAY_MS:55000}
      monthly-cron: ${MARKET_CPI_MONTHLY_SYNC_CRON:0 35 8 5 * *}
  policy-rate:
    weekly-sync:
      enabled: ${MARKET_POLICY_RATE_WEEKLY_SYNC_ENABLED:true}
      startup-delay-ms: ${MARKET_POLICY_RATE_WEEKLY_SYNC_STARTUP_DELAY_MS:45000}
      weekly-cron: ${MARKET_POLICY_RATE_WEEKLY_SYNC_CRON:0 20 7 * * MON}
  repo-rate:
    sync:
      enabled: ${MARKET_REPO_RATE_SYNC_ENABLED:true}
      startup-delay-ms: ${MARKET_REPO_RATE_SYNC_STARTUP_DELAY_MS:50000}
      weekly-cron: ${MARKET_REPO_RATE_SYNC_CRON:0 22 7 * * MON}
  tl-deposit:
    weekly-sync:
      enabled: ${MARKET_TL_DEPOSIT_WEEKLY_SYNC_ENABLED:true}
      startup-delay-ms: ${MARKET_TL_DEPOSIT_WEEKLY_SYNC_STARTUP_DELAY_MS:60000}
      weekly-cron: ${MARKET_TL_DEPOSIT_WEEKLY_SYNC_CRON:0 25 7 * * MON}
  ingestion:
    env: ${MARKET_INGESTION_ENV:dev}
  history:
    backfill:
      enabled: ${MARKET_HISTORY_BACKFILL_ENABLED:false}
      run-on-startup: ${MARKET_HISTORY_BACKFILL_RUN_ON_STARTUP:false}
      startup-depth-days: ${MARKET_HISTORY_BACKFILL_STARTUP_DEPTH_DAYS:7}
      schedule-initial-delay-ms: 10000
      schedule-delay-ms: 900000
      kafka:
        enabled: false
      retry:
        initial-delay-ms: 30000
        multiplier: 2.0
        max-delay-ms: 3600000
        max-attempts: 8
      years: 5
      chunk-days: 90
      min-price-history-days: 900
      min-recent-price-history-days: 120
      min-recent30-day-coverage-days: 15
      gate-live-until-history-ready: ${MARKET_HISTORY_BACKFILL_GATE_LIVE_UNTIL_HISTORY_READY:false}
      stock-bootstrap-parallelism: ${MARKET_HISTORY_BACKFILL_STOCK_BOOTSTRAP_PARALLELISM:4}
      sleep-ms: 200
  provider: composite
  fundamentals:
    cache-ttl-hours: ${MARKET_FUNDAMENTALS_CACHE_TTL_HOURS:24}
    max-annual-reports: ${MARKET_FUNDAMENTALS_MAX_ANNUAL_REPORTS:5}
    provider-order: ${MARKET_FUNDAMENTALS_PROVIDER_ORDER:FINNHUB,FMP,COINGECKO,INTERNAL_META}
  fx:
    scheduler-enabled: true
    provider-order:
      - TCMB
      - EXCHANGE_API
    provider-currencies:
      - USD
      - EUR
      - GBP
      - JPY
      - AED
      # Spot metals (XAUTRY, …) come from Minted/Stooq via CompositeFxProvider — not TCMB gram quotes.
    tcmb-url: https://www.tcmb.gov.tr/kurlar/today.xml
    tcmb-api-key: ${TCMB_API_KEY:}
    tcmb-api-key-query-param: ${TCMB_API_KEY_QUERY_PARAM:key}
    tcmb-api-key-header: ${TCMB_API_KEY_HEADER:X-API-Key}
    exchange-rate-url: https://open.er-api.com/v6/latest/TRY
  fund:
    scheduler-enabled: false
    delay-ms: 3600000
    http-url-template: ""
    # Legacy form POST (often 404 after TEFAS site migration); prefer tefas-fon-gnl-blg-url.
    tefas-bind-history-url: https://www.tefas.gov.tr/api/DB/BindHistoryInfo
    tefas-fon-gnl-blg-url: https://www.tefas.gov.tr/api/funds/fonGnlBlgSiraliGetir
    tefas-fon-gnl-chunk-days: 28
    tefas-fon-gnl-request-spacing-ms: 10000
    tefas-fontip: YAT
    tefas-history-lookback-days: 370
    tefas-history-chunk-inclusive-days: 89
    # FUND ingestion backfill initial depth (years), separate from market.history.backfill.years
    historical-nav-backfill-years: 1
    nav-history-bootstrap:
      enabled: false
      delay-ms: 45000
      lookback-days: 365
  bond:
    scheduler-enabled: true
    history-bootstrap:
      enabled: ${MARKET_BOND_HISTORY_BOOTSTRAP_ENABLED:true}
      delay-ms: ${MARKET_BOND_HISTORY_BOOTSTRAP_DELAY_MS:120000}
      lookback-years: 5
      chunk-days: 400
      chunk-spacing-ms: 400
      # EVDS: 1 = günlük (boş bırakılırsa frequency parametresi gönderilmez)
      evds-frequency: ${MARKET_BOND_HISTORY_EVDS_FREQUENCY:1}
      forward-fill-calendar-days: ${MARKET_BOND_HISTORY_FORWARD_FILL:true}
    history-refresh:
      enabled: ${MARKET_BOND_HISTORY_REFRESH_ENABLED:true}
      lookback-days: ${MARKET_BOND_HISTORY_REFRESH_LOOKBACK_DAYS:60}
      chunk-spacing-ms: ${MARKET_BOND_HISTORY_REFRESH_CHUNK_SPACING_MS:400}
      cron: ${MARKET_BOND_HISTORY_REFRESH_CRON:0 15 8 * * *}
  viop:
    enabled: ${MARKET_VIOP_ENABLED:false}
    cron: ${MARKET_VIOP_CRON:0 40 19 * * MON-FRI}
    zone: ${MARKET_VIOP_ZONE:Europe/Istanbul}
    connect-timeout-ms: ${MARKET_VIOP_CONNECT_TIMEOUT_MS:15000}
    read-timeout-ms: ${MARKET_VIOP_READ_TIMEOUT_MS:25000}
    request-spacing-ms: ${MARKET_VIOP_REQUEST_SPACING_MS:250}
    base-url: ${MARKET_VIOP_BASE_URL:https://www.borsaistanbul.com}
    contracts-path-template: ${MARKET_VIOP_CONTRACTS_PATH_TEMPLATE:/viopdata/viopms_{yyyyMMdd}.csv}
    settlement-path-template: ${MARKET_VIOP_SETTLEMENT_PATH_TEMPLATE:/viopdata/viop_{yyyyMMdd}.csv}
    source-lookup-days: ${MARKET_VIOP_SOURCE_LOOKUP_DAYS:10}
    contracts-urls:
      - ${MARKET_VIOP_CONTRACTS_URL_1:}
    settlement-urls:
      - ${MARKET_VIOP_SETTLEMENT_URL_1:}
    bond-keywords:
      - DIBS
      - TAHVIL
      - BONO
      - TRBOND
      - GOVBOND
      - TRT
      - KESN
    rate-keywords:
      - TLREF
      - FAIZ
      - INTEREST
  # Türkiye USD Hazine benchmark — tracked series: catalog.registry.providers.EurobondRegistry
  tr-gov-usd-eurobond:
    history-bootstrap:
      enabled: ${MARKET_TRGOVUSD_HISTORY_BOOTSTRAP_ENABLED:false}
      delay-ms: ${MARKET_TRGOVUSD_HISTORY_BOOTSTRAP_DELAY_MS:150000}
      chart-range: ${MARKET_TRGOVUSD_CHART_RANGE:10y}
      chart-interval: ${MARKET_TRGOVUSD_CHART_INTERVAL:1d}
      chunk-spacing-ms: ${MARKET_TRGOVUSD_CHUNK_SPACING_MS:400}
    history-refresh:
      enabled: ${MARKET_TRGOVUSD_HISTORY_REFRESH_ENABLED:false}
      cron: ${MARKET_TRGOVUSD_HISTORY_REFRESH_CRON:0 28 8 * * *}
      chart-range: ${MARKET_TRGOVUSD_REFRESH_CHART_RANGE:5y}
      chart-interval: ${MARKET_TRGOVUSD_REFRESH_CHART_INTERVAL:1d}
      chunk-spacing-ms: ${MARKET_TRGOVUSD_REFRESH_CHUNK_SPACING_MS:400}
  stock:
    shares-verification:
      enabled: ${MARKET_STOCK_SHARES_VERIFICATION_ENABLED:true}
      cron: ${MARKET_STOCK_SHARES_VERIFICATION_CRON:0 0 3 * * MON}
resilience:
  providers:
    tcmb:
      retry:
        max-attempts: 2
        delay-ms: 800
      timeout:
        millis: 25000
      circuit-breaker:
        failure-rate-threshold: 50
        sliding-window-size: 10
        wait-duration-in-open-state-ms: 60000
        permitted-number-of-calls-in-half-open-state: 2
    binance:
      retry:
        max-attempts: 3
        delay-ms: 500
      timeout:
        millis: 3000
      circuit-breaker:
        failure-rate-threshold: 50
        sliding-window-size: 10
        wait-duration-in-open-state-ms: 30000
        permitted-number-of-calls-in-half-open-state: 3
    coingecko:
      retry:
        max-attempts: 2
        delay-ms: 700
      timeout:
        millis: 4000
      circuit-breaker:
        failure-rate-threshold: 50
        sliding-window-size: 10
        wait-duration-in-open-state-ms: 30000
        permitted-number-of-calls-in-half-open-state: 3
    yahoo:
      retry:
        max-attempts: 2
        delay-ms: 1000
      timeout:
        millis: 12000
      circuit-breaker:
        failure-rate-threshold: 50
        sliding-window-size: 10
        wait-duration-in-open-state-ms: 60000
        permitted-number-of-calls-in-half-open-state: 2
    finnhub:
      retry:
        max-attempts: 2
        delay-ms: 1000
      timeout:
        millis: 12000
      circuit-breaker:
        failure-rate-threshold: 50
        sliding-window-size: 10
        wait-duration-in-open-state-ms: 60000
        permitted-number-of-calls-in-half-open-state: 2