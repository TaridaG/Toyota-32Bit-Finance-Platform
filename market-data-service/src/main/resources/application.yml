spring:
  application:
    name: market-data-service
  datasource:
    url: jdbc:h2:mem:marketdata;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    table: mds_flyway_schema_history
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    template:
      observation-enabled: true
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

providers:
  binance:
    base-url: https://api.binance.com
  coingecko:
    base-url: https://api.coingecko.com/api/v3
    api-key: ${COINGECKO_API_KEY:}
  fmp:
    enabled: ${PROVIDERS_FMP_ENABLED:false}
    base-url: https://financialmodelingprep.com/api/v3
    api-key: ${FMP_API_KEY:}
  yahoo:
    base-url: https://query1.finance.yahoo.com
    chart-path-template: /v8/finance/chart/{symbol}
    user-agent: Mozilla/5.0 (compatible; FinanceMarketDataService/1.0)
  finnhub:
    enabled: ${PROVIDERS_FINNHUB_ENABLED:false}
    base-url: https://finnhub.io
    stock-quote-path: /api/v1/quote
    stock-candle-path: /api/v1/stock/candle
    stock-profile-path: /api/v1/stock/profile2
    stock-financials-reported-path: /api/v1/stock/financials-reported
    stock-metric-path: /api/v1/stock/metric
    api-key: ${FINNHUB_API_KEY:}
    symbols:
      - AAPL
      - AMZN
      - NVDA
      - MSFT
      - GOOGL
      - VOO
      - VTI
      - QQQ
      - IVV
      - SPY

scheduler:
  market:
    delay-ms: 30000
  binance:
    delay-ms: 5000
  fx:
    delay-ms: 300000
  stock:
    delay-ms: 60000
  bond:
    delay-ms: 300000

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: http://jaeger:4318/v1/traces

market:
  evds:
    base-url: ${MARKET_EVDS_BASE_URL:https://evds2.tcmb.gov.tr/service/evds}
    api-key: ${MARKET_EVDS_API_KEY:${TCMB_API_KEY:}}
  ingestion:
    env: ${MARKET_INGESTION_ENV:dev}
  history:
    backfill:
      enabled: ${MARKET_HISTORY_BACKFILL_ENABLED:false}
      run-on-startup: ${MARKET_HISTORY_BACKFILL_RUN_ON_STARTUP:false}
      schedule-initial-delay-ms: 10000
      schedule-delay-ms: 60000
      kafka:
        enabled: false
      retry:
        initial-delay-ms: 1000
        multiplier: 2.0
        max-delay-ms: 300000
        max-attempts: 8
      years: 5
      chunk-days: 365
      min-price-history-days: 900
      min-recent-price-history-days: 120
      min-recent30-day-coverage-days: 15
      sleep-ms: 200
  tracked-funds: &mds-tracked-funds
    - AFT
    - AFA
    - TI2
  tracked-symbols:
    - BTCUSDT
    - ETHUSDT
    - BNBUSDT
    - SOLUSDT
    - XRPUSDT
  tracked-stocks:
    - GARAN
    - THYAO
    - ASELS
    - AAPL
    - AMZN
    - NVDA
    - MSFT
    - GOOGL
    - VOO
    - VTI
    - QQQ
    - IVV
    - SPY
    - GC=F
    - SI=F
    - HG=F
    - PA=F
    - PL=F
  provider: composite
  fundamentals:
    cache-ttl-hours: ${MARKET_FUNDAMENTALS_CACHE_TTL_HOURS:24}
    max-annual-reports: ${MARKET_FUNDAMENTALS_MAX_ANNUAL_REPORTS:5}
    provider-order: ${MARKET_FUNDAMENTALS_PROVIDER_ORDER:FINNHUB,FMP,COINGECKO,INTERNAL_META}
  fx:
    scheduler-enabled: true
    provider-order:
      - TCMB
      - EXCHANGE_API
    provider-currencies:
      - USD
      - EUR
      - GBP
      - JPY
      - AED
      - XAU
      - XAG
      - XPT
      - XPD
      - XCU
    tcmb-url: https://www.tcmb.gov.tr/kurlar/today.xml
    tcmb-api-key: ${TCMB_API_KEY:}
    tcmb-api-key-query-param: ${TCMB_API_KEY_QUERY_PARAM:key}
    tcmb-api-key-header: ${TCMB_API_KEY_HEADER:X-API-Key}
    exchange-rate-url: https://open.er-api.com/v6/latest/TRY
  fund:
    scheduler-enabled: false
    delay-ms: 3600000
    tracked-fund-codes: *mds-tracked-funds
    http-url-template: ""
    tefas-bind-history-url: https://www.tefas.gov.tr/api/DB/BindHistoryInfo
    tefas-fontip: YAT
    tefas-history-lookback-days: 370
    tefas-history-chunk-inclusive-days: 89
  bond:
    scheduler-enabled: true
    tracked:
      - symbol: TRBOND1Y
        evds-series: TP.KTF10
      - symbol: TRBOND2Y
        evds-series: TP.KTF11
      - symbol: TRBOND3Y
        evds-series: TP.KTF12
      - symbol: TRBOND5Y
        evds-series: TP.KTF13
      - symbol: TRBOND10Y
        evds-series: TP.KTF14
  stock:
    shares-verification:
      enabled: ${MARKET_STOCK_SHARES_VERIFICATION_ENABLED:true}
      cron: ${MARKET_STOCK_SHARES_VERIFICATION_CRON:0 0 3 * * MON}
resilience:
  providers:
    tcmb:
      retry:
        max-attempts: 2
        delay-ms: 800
      timeout:
        millis: 25000
      circuit-breaker:
        failure-rate-threshold: 50
        sliding-window-size: 10
        wait-duration-in-open-state-ms: 60000
        permitted-number-of-calls-in-half-open-state: 2
    binance:
      retry:
        max-attempts: 3
        delay-ms: 500
      timeout:
        millis: 3000
      circuit-breaker:
        failure-rate-threshold: 50
        sliding-window-size: 10
        wait-duration-in-open-state-ms: 30000
        permitted-number-of-calls-in-half-open-state: 3
    coingecko:
      retry:
        max-attempts: 2
        delay-ms: 700
      timeout:
        millis: 4000
      circuit-breaker:
        failure-rate-threshold: 50
        sliding-window-size: 10
        wait-duration-in-open-state-ms: 30000
        permitted-number-of-calls-in-half-open-state: 3
    yahoo:
      retry:
        max-attempts: 2
        delay-ms: 1000
      timeout:
        millis: 12000
      circuit-breaker:
        failure-rate-threshold: 50
        sliding-window-size: 10
        wait-duration-in-open-state-ms: 60000
        permitted-number-of-calls-in-half-open-state: 2
    finnhub:
      retry:
        max-attempts: 2
        delay-ms: 1000
      timeout:
        millis: 12000
      circuit-breaker:
        failure-rate-threshold: 50
        sliding-window-size: 10
        wait-duration-in-open-state-ms: 60000
        permitted-number-of-calls-in-half-open-state: 2