spring:
  application:
    name: market-data-service
  datasource:
    url: jdbc:h2:mem:marketdata;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    table: mds_flyway_schema_history
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    template:
      observation-enabled: true
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

providers:
  binance:
    base-url: https://api.binance.com
  coingecko:
    base-url: https://api.coingecko.com/api/v3

scheduler:
  binance:
    delay-ms: 5000
  fx:
    delay-ms: 300000

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: http://jaeger:4318/v1/traces

market:
  tracked-symbols:
    - BTCUSDT
    - ETHUSDT
    - BNBUSDT
    - SOLUSDT
    - XRPUSDT
  provider: composite
  fx:
    scheduler-enabled: true
    provider-currencies:
      - USD
      - EUR
    tcmb-url: https://www.tcmb.gov.tr/kurlar/today.xml
  fund:
    scheduler-enabled: false
    delay-ms: 3600000
    tracked-fund-codes: []
    http-url-template: ""
resilience:
  providers:
    tcmb:
      retry:
        max-attempts: 2
        delay-ms: 800
      timeout:
        millis: 25000
      circuit-breaker:
        failure-rate-threshold: 50
        sliding-window-size: 10
        wait-duration-in-open-state-ms: 60000
        permitted-number-of-calls-in-half-open-state: 2
    binance:
      retry:
        max-attempts: 3
        delay-ms: 500
      timeout:
        millis: 3000
      circuit-breaker:
        failure-rate-threshold: 50
        sliding-window-size: 10
        wait-duration-in-open-state-ms: 30000
        permitted-number-of-calls-in-half-open-state: 3
    coingecko:
      retry:
        max-attempts: 2
        delay-ms: 700
      timeout:
        millis: 4000
      circuit-breaker:
        failure-rate-threshold: 50
        sliding-window-size: 10
        wait-duration-in-open-state-ms: 30000
        permitted-number-of-calls-in-half-open-state: 3