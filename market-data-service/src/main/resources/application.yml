spring:
  application:
    name: market-data-service
  datasource:
    url: jdbc:h2:mem:marketdata;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    table: mds_flyway_schema_history
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    template:
      observation-enabled: true
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

providers:
  binance:
    base-url: https://api.binance.com
  coingecko:
    base-url: https://api.coingecko.com/api/v3
  investing:
    base-url: https://api.investing.com
    price-path-template: /api/financialdata/{symbol}/price
    user-agent: Mozilla/5.0 (compatible; FinanceMarketDataService/1.0)

scheduler:
  binance:
    delay-ms: 5000
  fx:
    delay-ms: 300000
  stock:
    delay-ms: 30000

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: http://jaeger:4318/v1/traces

market:
  tracked-funds: &mds-tracked-funds
    - AFT
    - AFA
    - TI2
  tracked-symbols:
    - BTCUSDT
    - ETHUSDT
    - BNBUSDT
    - SOLUSDT
    - XRPUSDT
  tracked-stocks:
    - GARAN
    - THYAO
    - ASELS
  provider: composite
  fx:
    scheduler-enabled: true
    provider-order:
      - TCMB
      - EXCHANGE_API
    provider-currencies:
      - USD
      - EUR
    tcmb-url: https://www.tcmb.gov.tr/kurlar/today.xml
    exchange-rate-url: https://open.er-api.com/v6/latest/TRY
  fund:
    scheduler-enabled: false
    delay-ms: 3600000
    tracked-fund-codes: *mds-tracked-funds
    http-url-template: ""
    tefas-bind-history-url: https://www.tefas.gov.tr/api/DB/BindHistoryInfo
    tefas-fontip: YAT
    tefas-history-lookback-days: 370
    tefas-history-chunk-inclusive-days: 89
resilience:
  providers:
    tcmb:
      retry:
        max-attempts: 2
        delay-ms: 800
      timeout:
        millis: 25000
      circuit-breaker:
        failure-rate-threshold: 50
        sliding-window-size: 10
        wait-duration-in-open-state-ms: 60000
        permitted-number-of-calls-in-half-open-state: 2
    binance:
      retry:
        max-attempts: 3
        delay-ms: 500
      timeout:
        millis: 3000
      circuit-breaker:
        failure-rate-threshold: 50
        sliding-window-size: 10
        wait-duration-in-open-state-ms: 30000
        permitted-number-of-calls-in-half-open-state: 3
    coingecko:
      retry:
        max-attempts: 2
        delay-ms: 700
      timeout:
        millis: 4000
      circuit-breaker:
        failure-rate-threshold: 50
        sliding-window-size: 10
        wait-duration-in-open-state-ms: 30000
        permitted-number-of-calls-in-half-open-state: 3
    investing_stock:
      retry:
        max-attempts: 2
        delay-ms: 1000
      timeout:
        millis: 12000
      circuit-breaker:
        failure-rate-threshold: 50
        sliding-window-size: 10
        wait-duration-in-open-state-ms: 60000
        permitted-number-of-calls-in-half-open-state: 2