server:
  port: 8082

spring:
  application:
    name: news-service

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:finance}
    username: ${DB_USERNAME:finance}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: http://jaeger:4318/v1/traces

news:
  instrument:
    keywords:
      BTCUSDT:
        - bitcoin
        - btc
      ETHUSDT:
        - ethereum
        - eth
      USDTRY:
        - usd
        - dolar
      GARAN:
        - garanti
      THYAO:
        - thy
        - turkish airlines
  scheduler:
    enabled: true
    delay-ms: 300000
  rss:
    connect-timeout-ms: ${NEWS_RSS_CONNECT_TIMEOUT_MS:5000}
    read-timeout-ms: ${NEWS_RSS_READ_TIMEOUT_MS:10000}
    max-entries-per-feed: ${NEWS_RSS_MAX_ENTRIES_PER_FEED:100}
    user-agent: ${NEWS_RSS_USER_AGENT:finance-news-service/1.0}

  feeds:
    - name: "Investing"
      url: "https://www.investing.com/rss/news_25.rss"
      category: GENERAL_ECONOMY

    - name: "CoinDesk"
      url: "https://www.coindesk.com/arc/outboundfeeds/rss/"
      category: CRYPTO

    - name: "MarketWatch"
      url: "https://feeds.content.dowjones.io/public/rss/mw_topstories"
      category: STOCK

    - name: "CoinTelegraph"
      url: "https://cointelegraph.com/rss"
      category: CRYPTO

    - name: "Binance Blog"
      url: "https://www.binance.com/en/blog/rss"
      category: CRYPTO

    - name: "Reuters Economy"
      url: "https://www.reuters.com/markets/europe/rss"
      category: GENERAL_ECONOMY

    - name: "Bloomberg Markets"
      url: "https://feeds.bloomberg.com/markets/news.rss"
      category: GENERAL_ECONOMY

    - name: "AA Ekonomi"
      url: "https://www.aa.com.tr/tr/rss/default?cat=ekonomi"
      category: GENERAL_ECONOMY

    - name: "Bigpara"
      url: "https://bigpara.hurriyet.com.tr/rss"
      category: STOCK

    - name: "Investing FX"
      url: "https://www.investing.com/rss/news_95.rss"
      category: FX