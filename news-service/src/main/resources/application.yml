server:
  port: 8082

spring:
  application:
    name: news-service

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:finance}
    username: ${DB_USERNAME:finance}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  security:
    oauth2:
      resourceserver:
        jwt:
          # Optional when using app.security.jwt.jwk-set-uri (Docker / multi-host iss).
          issuer-uri: ${JWT_ISSUER_URI:}

# In-cluster JWKS (see finance-api). When set, overrides issuer-only decoding so browser iss (:8085) matches.
app:
  security:
    jwt:
      jwk-set-uri: ${APP_SECURITY_JWT_JWK_SET_URI:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: http://jaeger:4318/v1/traces

