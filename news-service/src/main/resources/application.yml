    user-agent: ${NEWS_IMAGE_USER_AGENT:finance-news-service/1.0}
    backfill-enabled: ${NEWS_IMAGE_BACKFILL_ENABLED:true}
    backfill-batch-size: ${NEWS_IMAGE_BACKFILL_BATCH_SIZE:25}
    backfill-delay-ms: ${NEWS_IMAGE_BACKFILL_DELAY_MS:120000}
