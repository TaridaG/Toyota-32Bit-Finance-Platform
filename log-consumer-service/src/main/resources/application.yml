server:
  port: 8087

spring:
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
    listener:
      observation-enabled: true

log-consumer:
  topic: ${APP_LOGS_TOPIC:app.logs}
  group-id: ${LOG_CONSUMER_GROUP_ID:log-consumer-service}

opensearch:
  host: ${OPENSEARCH_HOST:opensearch}
  port: ${OPENSEARCH_PORT:9200}
  index-prefix: ${OPENSEARCH_INDEX_PREFIX:application-logs}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: http://jaeger:4318/v1/traces