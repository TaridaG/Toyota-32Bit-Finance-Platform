server:
  port: 8087

spring:
  application:
    name: log-consumer-service
  config:
    import: optional:classpath:application-openapi.yml
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
    listener:
      observation-enabled: true

log-consumer:
  topic: ${APP_LOGS_TOPIC:app.logs}
  group-id: ${LOG_CONSUMER_GROUP_ID:log-consumer-service}

opensearch:
  host: ${OPENSEARCH_HOST:opensearch}
  port: ${OPENSEARCH_PORT:9200}
  scheme: ${OPENSEARCH_SCHEME:http}
  username: ${OPENSEARCH_USERNAME:}
  password: ${OPENSEARCH_PASSWORD:}
  index-prefix: ${OPENSEARCH_INDEX_PREFIX:application-logs}
  log-retention-days: ${OPENSEARCH_LOG_RETENTION_DAYS:30}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: ${TRACING_SAMPLE_PROBABILITY:0.1}
  otlp:
    tracing:
      endpoint: http://jaeger:4318/v1/traces