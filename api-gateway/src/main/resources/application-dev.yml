server:
  port: 9090

app:
  security:
    jwt:
      issuer-uri: ${JWT_ISSUER_URI:}
      jwk-set-uri: ${JWT_JWK_SET_URI:http://localhost:8085/realms/finance/protocol/openid-connect/certs}

spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${app.security.jwt.issuer-uri}

gateway:
  services:
    finance-base-uri: ${FINANCE_BASE_URI:http://localhost:8080}
    market-base-uri: ${MARKET_BASE_URI:http://localhost:8082}
    news-base-uri: ${NEWS_BASE_URI:http://localhost:8083}
    analytics-base-uri: ${ANALYTICS_BASE_URI:http://localhost:8085}
    log-consumer-base-uri: ${LOG_CONSUMER_BASE_URI:http://localhost:8087}
    notification-base-uri: ${NOTIFICATION_BASE_URI:http://localhost:8086}

# Swagger UI is proxied from finance-api; aggregated specs are served by gateway routes.