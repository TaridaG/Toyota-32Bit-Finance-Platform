spring:
  codec:
    max-in-memory-size: 8MB
  application:
    name: api-gateway
  main:
    web-application-type: reactive
  cloud:
    gateway:
      httpclient:
        connect-timeout: 10000
        response-timeout: 120s
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${app.security.jwt.issuer-uri}

app:
  security:
    jwt:
      issuer-uri: ${JWT_ISSUER_URI:http://localhost:8085/realms/finance}
      # JWKS-only JWT decode (no iss hostname coupling). Without this, gateway may use issuer-uri-only decoder.
      jwk-set-uri: http://localhost:8085/realms/finance/protocol/openid-connect/certs

resilience4j:
  timelimiter:
    configs:
      default:
        timeoutDuration: 120s
        cancelRunningFuture: true
    instances:
      financeCircuitBreaker:
        baseConfig: default
      marketCircuitBreaker:
        baseConfig: default
      newsCircuitBreaker:
        baseConfig: default
      analyticsCircuitBreaker:
        baseConfig: default

gateway:
  cors:
    allowed-origins: ${GATEWAY_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  services:
    finance-base-uri: ${FINANCE_BASE_URI:http://finance-api:8080}
    market-base-uri: ${MARKET_BASE_URI:http://market-data-service:8080}
    news-base-uri: ${NEWS_BASE_URI:http://news-service:8082}
    analytics-base-uri: ${ANALYTICS_BASE_URI:http://analytics-service:8080}
    log-consumer-base-uri: ${LOG_CONSUMER_BASE_URI:http://log-consumer-service:8087}
    notification-base-uri: ${NOTIFICATION_BASE_URI:http://notification-service:8086}
  user-context:
    user-id-claim: sub
    username-claim: preferred_username
    roles-claim: roles
    roles-path: realm_access.roles
    email-claim: email

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %5p [%X{correlationId:-}] --- [%t] %-40.40logger{39} : %m%n%wEx"

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: ${TRACING_SAMPLE_PROBABILITY:0.1}
  otlp:
    tracing:
      endpoint: http://jaeger:4318/v1/traces