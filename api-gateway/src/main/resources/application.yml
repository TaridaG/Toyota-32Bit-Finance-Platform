spring:
  application:
    name: api-gateway
  main:
    web-application-type: reactive

gateway:
  services:
    finance-base-uri: http://finance-api:8080
    market-base-uri: http://market-data-service:8080
    news-base-uri: http://news-service:8082
  user-context:
    user-id-claim: sub
    username-claim: preferred_username
    roles-claim: roles
    roles-path: realm_access.roles

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: http://jaeger:4318/v1/traces