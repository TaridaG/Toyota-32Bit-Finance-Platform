services:

  postgres:
    image: postgres:15
    container_name: finance-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: finance
      POSTGRES_USER: finance
      POSTGRES_PASSWORD: 123456
    ports:
      - "5432:5432"
    volumes:
      - finance_pg_data:/var/lib/postgresql/data

  kafka:
    image: apache/kafka:3.7.0
    container_name: kafka
    depends_on:
      - postgres
    ports:
      - "9092:9092"
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_LOG_DIRS=/tmp/kraft-combined-logs
    volumes:
      - kafka_data:/var/lib/kafka/data # Bitnami değil apache/kafka kullandığım için burayı da güncelledim

  finance-api:
    build:
      context: ..
      dockerfile: backend/finance-api/Dockerfile
    container_name: finance-api
    depends_on:
      - postgres
      - kafka
    environment:
      - SPRING_PROFILES_ACTIVE=kafka
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/finance
      - SPRING_DATASOURCE_USERNAME=finance
      - SPRING_DATASOURCE_PASSWORD=finance
    ports:
      - "8080:8080"

  notification-service:
    build:
      context: ..
      dockerfile: notification-service/Dockerfile
    container_name: notification-service
    depends_on:
      - kafka
    environment:
      - SPRING_PROFILES_ACTIVE=docker

volumes:
  finance_pg_data:
  kafka_data:
