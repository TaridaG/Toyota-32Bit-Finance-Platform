services:
  # -----------------------------
  # Core infrastructure
  # -----------------------------
  postgres:
    image: postgres:15
    container_name: finance-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: finance
      POSTGRES_USER: finance
      POSTGRES_PASSWORD: 123456
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finance -d finance"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    volumes:
      - finance_pg_data:/var/lib/postgresql/data
    networks:
      - finance-net

  redis:
    image: redis:7-alpine
    container_name: finance-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - finance-net

  kafka:
    image: apache/kafka:3.7.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_LOG_DIRS=/tmp/kraft-combined-logs
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - finance-net

  keycloak:
    image: quay.io/keycloak/keycloak:25.0.6
    container_name: keycloak
    # Import realm JSON from /opt/keycloak/data/import on startup (seed users e.g. admin1 — see keycloak/realm-finance.json).
    command: ["start-dev", "--import-realm"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: finance
      KC_DB_PASSWORD: 123456
      # Canonical issuer for browser / SPA tokens (must match gateway app.security.jwt.issuer-uri).
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME: localhost
      KC_HOSTNAME_PORT: 8085
      KC_HOSTNAME_URL: http://localhost:8085
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
    ports:
      - "8085:8080"
    volumes:
      - ./keycloak/realm-finance.json:/opt/keycloak/data/import/realm-finance.json:ro
    networks:
      - finance-net

  minio:
    image: minio/minio
    container_name: minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - finance-net

  opensearch:
    image: opensearchproject/opensearch:2.12.0
    container_name: opensearch
    environment:
      - discovery.type=single-node
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=142536otuzikibit!@TOYOTAa
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    networks:
      - finance-net

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2.12.0
    container_name: opensearch-dashboards
    ports:
      - "5601:5601"
    environment:
      - OPENSEARCH_HOSTS=https://opensearch:9200
      - OPENSEARCH_USERNAME=admin
      - OPENSEARCH_PASSWORD=142536otuzikibit!@TOYOTAa
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
    depends_on:
      opensearch:
        condition: service_started
    networks:
      - finance-net

  jaeger:
    image: jaegertracing/all-in-one:1.55
    container_name: jaeger
    ports:
      - "16686:16686"
      - "4318:4318"
    networks:
      - finance-net

  # -----------------------------
  # Backend application services
  # -----------------------------
  finance-api:
    build:
      context: ../backend/finance-api
      dockerfile: Dockerfile
    container_name: finance-api
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
      redis:
        condition: service_healthy
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/finance
      - SPRING_DATASOURCE_USERNAME=finance
      - SPRING_DATASOURCE_PASSWORD=123456
      - SPRING_FLYWAY_TABLE=finance_flyway_schema_history
      - SPRING_FLYWAY_BASELINE_ON_MIGRATE=true
      - SPRING_FLYWAY_BASELINE_VERSION=0
      - SPRING_REDIS_HOST=redis
      - SPRING_REDIS_PORT=6379
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - APP_SECURITY_ALLOW_HEADER_USER_FALLBACK=${APP_SECURITY_ALLOW_HEADER_USER_FALLBACK:-true}
      - SPRING_PROFILES_ACTIVE=docker,kafka,cache-redis
      - APP_SECURITY_JWT_JWK_SET_URI=http://keycloak:8080/realms/finance/protocol/openid-connect/certs
      - KEYCLOAK_SERVER_URL=http://keycloak:8080
      - KEYCLOAK_ADMIN_USERNAME=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
      - CLIENTS_NEWS_BASE_URL=http://news-service:8082
      - APP_REGISTRATION_ENABLED=true
      - APP_REGISTRATION_VERIFICATION_ENABLED=true
      - APP_REGISTRATION_VERIFICATION_HASH_SECRET=finance-email-verify-secret
      - SPRING_MAIL_HOST=smtp.gmail.com
      - SPRING_MAIL_PORT=587
      - SPRING_MAIL_USERNAME=32bitdemofinanceplatformmm@gmail.com
      - SPRING_MAIL_PASSWORD=mpxnlgmbyehkiqwm
      - APP_REGISTRATION_VERIFICATION_FROM=32bitdemofinanceplatformmm@gmail.com
      - KEYCLOAK_PORTAL_CLIENT_SECRET=finance-portal-dev-secret
      - MARKET_TR_USD_EUROBOND_YAHOO_ENABLED=${MARKET_TR_USD_EUROBOND_YAHOO_ENABLED:-true}
      - AI_ENABLED=true
    networks:
      - finance-net

  market-data-service:
    build:
      context: ../market-data-service
      dockerfile: Dockerfile
    container_name: market-data-service
    depends_on:
      kafka:
        condition: service_started
      postgres:
        condition: service_healthy
      finance-api:
        condition: service_started
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/finance
      - SPRING_DATASOURCE_USERNAME=finance
      - SPRING_DATASOURCE_PASSWORD=123456
      - SPRING_FLYWAY_BASELINE_ON_MIGRATE=true
      - SPRING_FLYWAY_BASELINE_VERSION=0
      - TCMB_API_KEY=${TCMB_API_KEY:-NvIg6r0WZV}
      - TCMB_API_KEY_QUERY_PARAM=${TCMB_API_KEY_QUERY_PARAM:-key}
      - TCMB_API_KEY_HEADER=${TCMB_API_KEY_HEADER:-X-API-Key}
      # EVDS: ayrı anahtar istenirse host .env'de MARKET_EVDS_API_KEY tanımlayın. Boş string geçirmeyin —
      # aksi halde Spring ilk property'yi boş görür ve TCMB_API_KEY yedeğine düşmez. Tanımsız bırakınca yalnızca TCMB_API_KEY kullanılır.
      - MARKET_EVDS_BASE_URL=${MARKET_EVDS_BASE_URL:-https://evds3.tcmb.gov.tr/igmevdsms-dis}
      - PROVIDERS_FINNHUB_ENABLED=true
      - FINNHUB_API_KEY=d7r26q9r01qtpsm0phfgd7r26q9r01qtpsm0phg0
      - MARKET_HISTORY_BACKFILL_ENABLED=true
      - MARKET_HISTORY_BACKFILL_RUN_ON_STARTUP=false
      - MARKET_FUND_NAV_HISTORY_BOOTSTRAP_ENABLED=true
      - MARKET_FUND_NAV_HISTORY_BOOTSTRAP_DELAY_MS=90000
      - MARKET_FUND_NAV_HISTORY_LOOKBACK_DAYS=365
      # TEFAS NAV: bootstrap loads history once; without this, latest NAV goes stale → short-horizon % near 0 and UI shows "Delayed data".
      - MARKET_FUND_SCHEDULER_ENABLED=true
      # TCMB Hazine getiri (TRBOND*): EVDS günlük geçmiş → mds_market_price_history (varsayılan açık; kapatmak için false).
      - MARKET_BOND_HISTORY_BOOTSTRAP_ENABLED=${MARKET_BOND_HISTORY_BOOTSTRAP_ENABLED:-true}
      - MARKET_BOND_HISTORY_BOOTSTRAP_DELAY_MS=${MARKET_BOND_HISTORY_BOOTSTRAP_DELAY_MS:-120000}
    networks:
      - finance-net

  analytics-service:
    build:
      context: ../analytics-service
      dockerfile: Dockerfile
    container_name: analytics-service
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
      finance-api:
        condition: service_started
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/finance
      - SPRING_DATASOURCE_USERNAME=finance
      - SPRING_DATASOURCE_PASSWORD=123456
      - SPRING_FLYWAY_TABLE=analytics_flyway_schema_history
      - SPRING_FLYWAY_BASELINE_ON_MIGRATE=true
      - SPRING_FLYWAY_BASELINE_VERSION=0
      - SPRING_FLYWAY_ENABLED=false
      - SPRING_JPA_HIBERNATE_DDL_AUTO=none
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - FINANCE_BASE_URL=http://finance-api:8080
      - CLIENTS_FINANCE_AUTH_MODE=${CLIENTS_FINANCE_AUTH_MODE:-bearer}
      - CLIENTS_FINANCE_BEARER_TOKEN=${CLIENTS_FINANCE_BEARER_TOKEN:-dev-static-token}
    networks:
      - finance-net

  reporting-service:
    build:
      context: ../reporting-service
      dockerfile: Dockerfile
    container_name: reporting-service
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
      analytics-service:
        condition: service_started
      finance-api:
        condition: service_started
      minio:
        condition: service_started
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/finance
      - SPRING_DATASOURCE_USERNAME=finance
      - SPRING_DATASOURCE_PASSWORD=123456
      - SPRING_FLYWAY_TABLE=reporting_flyway_schema_history
      - SPRING_FLYWAY_BASELINE_ON_MIGRATE=true
      - SPRING_FLYWAY_BASELINE_VERSION=0
      - SPRING_FLYWAY_ENABLED=false
      - SPRING_JPA_HIBERNATE_DDL_AUTO=none
      - ANALYTICS_BASE_URL=http://analytics-service:8080
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - FINANCE_BASE_URL=http://finance-api:8080
      - MINIO_URL=http://minio:9000
      - CLIENTS_FINANCE_AUTH_MODE=${CLIENTS_FINANCE_AUTH_MODE:-bearer}
      - CLIENTS_FINANCE_BEARER_TOKEN=${CLIENTS_FINANCE_BEARER_TOKEN:-dev-static-token}
    networks:
      - finance-net

  notification-service:
    build:
      context: ../notification-service
      dockerfile: Dockerfile
    container_name: notification-service
    depends_on:
      kafka:
        condition: service_started
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - MANAGEMENT_HEALTH_MAIL_ENABLED=false
    networks:
      - finance-net

  news-service:
    build:
      context: ../news-service
      dockerfile: Dockerfile
    container_name: news-service
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=finance
      - DB_USERNAME=finance
      - DB_PASSWORD=${NEWS_DB_PASSWORD:?NEWS_DB_PASSWORD is required}
      - APP_SECURITY_JWT_JWK_SET_URI=http://keycloak:8080/realms/finance/protocol/openid-connect/certs
      - NEWS_RSS_CONNECT_TIMEOUT_MS=${NEWS_RSS_CONNECT_TIMEOUT_MS:-5000}
      - NEWS_RSS_READ_TIMEOUT_MS=${NEWS_RSS_READ_TIMEOUT_MS:-10000}
      - NEWS_RSS_MAX_ENTRIES_PER_FEED=${NEWS_RSS_MAX_ENTRIES_PER_FEED:-100}
      - NEWS_RSS_USER_AGENT=${NEWS_RSS_USER_AGENT:-finance-news-service/1.0}
      # Optional: raises MyMemory free tier; see https://mymemory.translated.net/doc/usagelimits.php
      - NEWS_TRANSLATION_MYMEMORY_EMAIL=${NEWS_TRANSLATION_MYMEMORY_EMAIL:-}
      - JAVA_TOOL_OPTIONS=-Djava.io.tmpdir=/tmp -XX:MaxRAMPercentage=75.0
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - finance-net

  log-consumer-service:
    build:
      context: ../log-consumer-service
      dockerfile: Dockerfile
    container_name: log-consumer-service
    depends_on:
      kafka:
        condition: service_started
      opensearch:
        condition: service_started
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - APP_LOGS_TOPIC=app.logs
      - OPENSEARCH_HOST=opensearch
      - OPENSEARCH_PORT=9200
      - OPENSEARCH_SCHEME=https
      - OPENSEARCH_USERNAME=admin
      - OPENSEARCH_PASSWORD=142536otuzikibit!@TOYOTAa
      - OPENSEARCH_INDEX_PREFIX=application-logs
    networks:
      - finance-net

  api-gateway:
    build:
      context: ../api-gateway
      dockerfile: Dockerfile
    container_name: api-gateway
    depends_on:
      finance-api:
        condition: service_started
      market-data-service:
        condition: service_started
      analytics-service:
        condition: service_started
      reporting-service:
        condition: service_started
      news-service:
        condition: service_started
      keycloak:
        condition: service_started
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      JWT_ISSUER_URI: http://localhost:8085/realms/finance
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
    ports:
      - "8080:8080"
    networks:
      - finance-net

  frontend-web:
    build:
      context: ../frontend-web
      dockerfile: Dockerfile
    container_name: frontend-web
    depends_on:
      api-gateway:
        condition: service_started
    ports:
      - "5173:5173"
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
      - VITE_PROXY_TARGET=http://api-gateway:8080
      # Single /api proxy — split routing would send /api/market to localhost:8082 inside the container (broken).
      - VITE_DEV_PROXY_GATEWAY=true
    volumes:
      - ../frontend-web:/app
      - frontend_web_node_modules:/app/node_modules
    networks:
      - finance-net

  # -----------------------------
  # Observability
  # -----------------------------
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      finance-api:
        condition: service_started
      market-data-service:
        condition: service_started
      news-service:
        condition: service_started
      api-gateway:
        condition: service_started
      notification-service:
        condition: service_started
      log-consumer-service:
        condition: service_started
      analytics-service:
        condition: service_started
      reporting-service:
        condition: service_started
    networks:
      - finance-net

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      prometheus:
        condition: service_started
    networks:
      - finance-net

networks:
  finance-net:
    driver: bridge

volumes:
  finance_pg_data:
  kafka_data:
  frontend_web_node_modules:

