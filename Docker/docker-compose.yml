# Secrets: cp .env.example .env (gitignore) and set TCMB_API_KEY, FINNHUB_API_KEY, mail, etc. — never commit real keys.
# Compose reads Docker/.env for ${VAR:?...} substitution; app services also use env_file: .env.
# Do not set MARKET_EVDS_API_KEY= (empty) in .env — omit the line or set a real key; TCMB_API_KEY is the EVDS fallback.
# Personal overrides: docker-compose.override.yml (see docker-compose.override.yml.example).

services:
  # -----------------------------
  # Core infrastructure
  # -----------------------------
  postgres:
    image: postgres:15
    container_name: finance-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: finance
      POSTGRES_USER: finance
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-123456}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finance -d finance"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    volumes:
      - finance_pg_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - finance-net

  redis:
    image: redis:7-alpine
    container_name: finance-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - finance-net

  kafka:
    image: apache/kafka:3.7.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_LOG_DIRS=/tmp/kraft-combined-logs
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - finance-net

  keycloak:
    image: quay.io/keycloak/keycloak:25.0.6
    container_name: keycloak
    # Import realm JSON from /opt/keycloak/data/import on startup (seed users e.g. admin1 — see keycloak/realm-finance.json).
    command: ["start-dev", "--import-realm"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: finance
      KC_DB_PASSWORD: 123456
      # Canonical issuer for browser / SPA tokens (must match gateway app.security.jwt.issuer-uri).
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME: localhost
      KC_HOSTNAME_PORT: 8085
      KC_HOSTNAME_URL: http://localhost:8085
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
    ports:
      - "8085:8080"
    volumes:
      - ./keycloak/realm-finance.json:/opt/keycloak/data/import/realm-finance.json:ro
    networks:
      - finance-net

  opensearch:
    image: opensearchproject/opensearch:2.12.0
    container_name: opensearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      # Demo installer rejects numeric-only passwords; use mounted security config (admin / 123456789).
      - DISABLE_INSTALL_DEMO_CONFIG=true
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
    volumes:
      - opensearch_data:/usr/share/opensearch/data
      - ./opensearch-config/opensearch.yml:/usr/share/opensearch/config/opensearch.yml:ro
      - ./opensearch-config/opensearch-security:/usr/share/opensearch/config/opensearch-security:ro
      - ./opensearch-config/esnode.pem:/usr/share/opensearch/config/esnode.pem:ro
      - ./opensearch-config/esnode-key.pem:/usr/share/opensearch/config/esnode-key.pem:ro
      - ./opensearch-config/root-ca.pem:/usr/share/opensearch/config/root-ca.pem:ro
      - ./opensearch-config/kirk.pem:/usr/share/opensearch/config/kirk.pem:ro
      - ./opensearch-config/kirk-key.pem:/usr/share/opensearch/config/kirk-key.pem:ro
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -ksu admin:123456789 https://localhost:9200/_cluster/health | grep -Eq '\"status\":\"(green|yellow)\"'"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - finance-net

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2.12.0
    container_name: opensearch-dashboards
    restart: unless-stopped
    ports:
      - "5601:5601"
    environment:
      OPENSEARCH_HOSTS: https://opensearch:9200
      OPENSEARCH_USERNAME: kibanaserver
      OPENSEARCH_PASSWORD: kibanaserver
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    depends_on:
      opensearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -u admin:123456789 http://localhost:5601/api/status | grep -q '\"state\":\"green\"'"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 90s
    networks:
      - finance-net

  jaeger:
    image: jaegertracing/all-in-one:1.55
    container_name: jaeger
    ports:
      - "16686:16686"
      - "4318:4318"
    networks:
      - finance-net

  # -----------------------------
  # Backend application services
  # -----------------------------
  finance-api:
    build:
      context: ..
      dockerfile: finance-api/Dockerfile
    container_name: finance-api
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
      redis:
        condition: service_healthy
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/finance
      - SPRING_DATASOURCE_USERNAME=finance
      - SPRING_DATASOURCE_PASSWORD=123456
      - SPRING_FLYWAY_TABLE=finance_flyway_schema_history
      - SPRING_FLYWAY_BASELINE_ON_MIGRATE=true
      - SPRING_FLYWAY_BASELINE_VERSION=0
      - SPRING_REDIS_HOST=redis
      - SPRING_REDIS_PORT=6379
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - APP_SECURITY_ALLOW_HEADER_USER_FALLBACK=${APP_SECURITY_ALLOW_HEADER_USER_FALLBACK:-true}
      - SPRING_PROFILES_ACTIVE=docker,kafka,cache-redis
      - APP_SECURITY_JWT_JWK_SET_URI=http://keycloak:8080/realms/finance/protocol/openid-connect/certs
      - KEYCLOAK_SERVER_URL=http://keycloak:8080
      - KEYCLOAK_ADMIN_USERNAME=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
      - CLIENTS_NEWS_BASE_URL=http://news-service:8082
      - APP_REGISTRATION_ENABLED=true
      - APP_REGISTRATION_VERIFICATION_ENABLED=true
      - APP_REGISTRATION_VERIFICATION_HASH_SECRET=finance-email-verify-secret
      - SPRING_MAIL_HOST=smtp.gmail.com
      - SPRING_MAIL_PORT=587
      # SPRING_MAIL_* / APP_REGISTRATION_VERIFICATION_FROM: set in Docker/.env (env_file)
      - APP_PORTAL_PUBLIC_URL=http://localhost:5173
      - KEYCLOAK_PORTAL_CLIENT_SECRET=finance-portal-dev-secret
      - APP_MFA_ENCRYPTION_SECRET=${APP_MFA_ENCRYPTION_SECRET:-finance-mfa-dev-encryption-secret}
      - APP_MFA_ISSUER=${APP_MFA_ISSUER:-Finance Portal}
      - APP_TRUSTED_DEVICE_ENABLED=${APP_TRUSTED_DEVICE_ENABLED:-true}
      - APP_TRUSTED_DEVICE_SIGNING_SECRET=${APP_TRUSTED_DEVICE_SIGNING_SECRET:-finance-trusted-device-dev-secret}
      - MARKET_TR_USD_EUROBOND_YAHOO_ENABLED=${MARKET_TR_USD_EUROBOND_YAHOO_ENABLED:-true}
      - AI_ENABLED=${AI_ENABLED:-true}
      - PROFILE_AVATAR_STORAGE_ROOT=/photos
    volumes:
      - ../photos:/photos
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 120s
    networks:
      - finance-net

  market-data-service:
    build:
      context: ..
      dockerfile: market-data-service/Dockerfile
    container_name: market-data-service
    env_file:
      - .env
    depends_on:
      kafka:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      finance-api:
        condition: service_healthy
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - SPRING_REDIS_HOST=redis
      - SPRING_REDIS_PORT=6379
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/finance
      - SPRING_DATASOURCE_USERNAME=finance
      - SPRING_DATASOURCE_PASSWORD=123456
      - SPRING_FLYWAY_BASELINE_ON_MIGRATE=true
      - SPRING_FLYWAY_BASELINE_VERSION=0
      - TCMB_API_KEY=${TCMB_API_KEY:?Set TCMB_API_KEY in Docker/.env — copy .env.example to .env}
      - TCMB_API_KEY_QUERY_PARAM=${TCMB_API_KEY_QUERY_PARAM:-key}
      - TCMB_API_KEY_HEADER=${TCMB_API_KEY_HEADER:-X-API-Key}
      # EVDS: ayrı anahtar istenirse host .env'de MARKET_EVDS_API_KEY tanımlayın. Boş string geçirmeyin —
      # aksi halde Spring ilk property'yi boş görür ve TCMB_API_KEY yedeğine düşmez. Tanımsız bırakınca yalnızca TCMB_API_KEY kullanılır.
      - MARKET_EVDS_BASE_URL=${MARKET_EVDS_BASE_URL:-https://evds3.tcmb.gov.tr/igmevdsms-dis}
      - PROVIDERS_FINNHUB_ENABLED=${PROVIDERS_FINNHUB_ENABLED:-true}
      # FINNHUB_API_KEY: Docker/.env (env_file); required when PROVIDERS_FINNHUB_ENABLED=true
      - MARKET_HISTORY_BACKFILL_ENABLED=true
      - MARKET_HISTORY_BACKFILL_RUN_ON_STARTUP=true
      - MARKET_HISTORY_BACKFILL_GATE_LIVE_UNTIL_HISTORY_READY=false
      - MARKET_HISTORY_BACKFILL_STOCK_BOOTSTRAP_PARALLELISM=4
      - MARKET_FUND_NAV_HISTORY_BOOTSTRAP_ENABLED=true
      - MARKET_FUND_NAV_HISTORY_BOOTSTRAP_DELAY_MS=90000
      - MARKET_FUND_NAV_HISTORY_LOOKBACK_DAYS=365
      # TEFAS NAV: bootstrap loads history once; without this, latest NAV goes stale → short-horizon % near 0 and UI shows "Delayed data".
      - MARKET_FUND_SCHEDULER_ENABLED=true
      # TCMB Hazine getiri (TRBOND*): EVDS günlük geçmiş → mds_market_price_history (varsayılan açık; kapatmak için false).
      - MARKET_BOND_HISTORY_BOOTSTRAP_ENABLED=${MARKET_BOND_HISTORY_BOOTSTRAP_ENABLED:-true}
      - MARKET_BOND_HISTORY_BOOTSTRAP_DELAY_MS=${MARKET_BOND_HISTORY_BOOTSTRAP_DELAY_MS:-120000}
      - MARKET_VIOP_ENABLED=${MARKET_VIOP_ENABLED:-true}
      - MARKET_VIOP_CRON=${MARKET_VIOP_CRON:-0 */2 * * * *}
      - MARKET_VIOP_ZONE=${MARKET_VIOP_ZONE:-Europe/Istanbul}
      - MARKET_VIOP_BASE_URL=${MARKET_VIOP_BASE_URL:-https://www.borsaistanbul.com}
      - MARKET_VIOP_CONTRACTS_PATH_TEMPLATE=${MARKET_VIOP_CONTRACTS_PATH_TEMPLATE:-/viopdata/viopms_{yyyyMMdd}.csv}
      - MARKET_VIOP_SETTLEMENT_PATH_TEMPLATE=${MARKET_VIOP_SETTLEMENT_PATH_TEMPLATE:-/viopdata/viop_{yyyyMMdd}.csv}
      - MARKET_VIOP_SOURCE_LOOKUP_DAYS=${MARKET_VIOP_SOURCE_LOOKUP_DAYS:-14}
    networks:
      - finance-net

  analytics-service:
    build:
      context: ..
      dockerfile: analytics-service/Dockerfile
    container_name: analytics-service
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
      finance-api:
        condition: service_healthy
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/finance
      - SPRING_DATASOURCE_USERNAME=finance
      - SPRING_DATASOURCE_PASSWORD=123456
      - SPRING_FLYWAY_TABLE=analytics_flyway_schema_history
      - SPRING_FLYWAY_BASELINE_ON_MIGRATE=true
      - SPRING_FLYWAY_BASELINE_VERSION=0
      - SPRING_FLYWAY_ENABLED=true
      - SPRING_JPA_HIBERNATE_DDL_AUTO=none
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - FINANCE_BASE_URL=http://finance-api:8080
      - CLIENTS_FINANCE_AUTH_MODE=${CLIENTS_FINANCE_AUTH_MODE:-none}
    networks:
      - finance-net

  notification-service:
    build:
      context: ..
      dockerfile: notification-service/Dockerfile
    container_name: notification-service
    env_file:
      - .env
    depends_on:
      kafka:
        condition: service_started
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/finance
      - SPRING_DATASOURCE_USERNAME=finance
      - SPRING_DATASOURCE_PASSWORD=123456
      - SPRING_FLYWAY_BASELINE_ON_MIGRATE=true
      - SPRING_FLYWAY_BASELINE_VERSION=0
      # SMTP_* / NOTIFICATION_MAIL_FROM: set in Docker/.env (env_file)
      - APP_PORTAL_PUBLIC_URL=${APP_PORTAL_PUBLIC_URL:-http://localhost:5173}
      - MANAGEMENT_HEALTH_MAIL_ENABLED=false
    networks:
      - finance-net

  news-service:
    build:
      context: ..
      dockerfile: news-service/Dockerfile
    container_name: news-service
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=finance
      - DB_USERNAME=finance
      - DB_PASSWORD=${NEWS_DB_PASSWORD:?NEWS_DB_PASSWORD is required}
      - SPRING_FLYWAY_BASELINE_ON_MIGRATE=true
      - SPRING_FLYWAY_BASELINE_VERSION=0
      - APP_SECURITY_JWT_JWK_SET_URI=http://keycloak:8080/realms/finance/protocol/openid-connect/certs
      - NEWS_RSS_CONNECT_TIMEOUT_MS=${NEWS_RSS_CONNECT_TIMEOUT_MS:-5000}
      - NEWS_RSS_READ_TIMEOUT_MS=${NEWS_RSS_READ_TIMEOUT_MS:-10000}
      - NEWS_RSS_MAX_ENTRIES_PER_FEED=${NEWS_RSS_MAX_ENTRIES_PER_FEED:-100}
      - NEWS_RSS_USER_AGENT=${NEWS_RSS_USER_AGENT:-finance-news-service/1.0}
      # Optional: raises MyMemory free tier; see https://mymemory.translated.net/doc/usagelimits.php
      - NEWS_TRANSLATION_MYMEMORY_EMAIL=${NEWS_TRANSLATION_MYMEMORY_EMAIL:-}
      - JAVA_TOOL_OPTIONS=-Djava.io.tmpdir=/tmp -XX:MaxRAMPercentage=75.0
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - finance-net

  log-consumer-service:
    build:
      context: ..
      dockerfile: log-consumer-service/Dockerfile
    container_name: log-consumer-service
    depends_on:
      kafka:
        condition: service_started
      opensearch:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      APP_LOGS_TOPIC: app.logs
      LOG_CONSUMER_GROUP_ID: log-consumer-service
      SPRING_APPLICATION_NAME: log-consumer-service
      OPENSEARCH_HOST: opensearch
      OPENSEARCH_PORT: "9200"
      OPENSEARCH_SCHEME: https
      OPENSEARCH_USERNAME: admin
      OPENSEARCH_PASSWORD: "123456789"
      OPENSEARCH_INDEX_PREFIX: application-logs
    networks:
      - finance-net

  api-gateway:
    build:
      context: ..
      dockerfile: api-gateway/Dockerfile
    container_name: api-gateway
    env_file:
      - .env
    depends_on:
      kafka:
        condition: service_started
      finance-api:
        condition: service_started
      market-data-service:
        condition: service_started
      analytics-service:
        condition: service_started
      news-service:
        condition: service_started
      keycloak:
        condition: service_started
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      JWT_ISSUER_URI: ${JWT_ISSUER_URI:-http://localhost:8085/realms/finance}
      GATEWAY_CORS_ALLOWED_ORIGINS: ${GATEWAY_CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "8080:8080"
    networks:
      - finance-net

  # Production SPA (nginx + vite build). UI hot-reload: docker compose --profile dev (frontend-web-dev :5174).
  frontend-web:
    build:
      context: ../frontend-web
      dockerfile: Dockerfile
    container_name: frontend-web
    depends_on:
      api-gateway:
        condition: service_started
    ports:
      - "5173:80"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - finance-net

  frontend-web-dev:
    profiles: ["dev"]
    build:
      context: ../frontend-web
      dockerfile: Dockerfile.dev
    container_name: frontend-web-dev
    depends_on:
      api-gateway:
        condition: service_started
    ports:
      - "5174:5173"
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
      - VITE_PROXY_TARGET=http://api-gateway:8080
      - VITE_DEV_PROXY_GATEWAY=true
    volumes:
      - ../frontend-web:/app
      - frontend_web_node_modules:/app/node_modules
    networks:
      - finance-net

  # -----------------------------
  # Observability
  # -----------------------------
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      finance-api:
        condition: service_started
      market-data-service:
        condition: service_started
      news-service:
        condition: service_started
      api-gateway:
        condition: service_started
      notification-service:
        condition: service_started
      log-consumer-service:
        condition: service_started
      analytics-service:
        condition: service_started
    networks:
      - finance-net

  grafana:
    image: grafana/grafana:11.4.0
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/etc/grafana/provisioning/dashboards/json/finance-platform-overview.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      prometheus:
        condition: service_started
    networks:
      - finance-net

networks:
  finance-net:
    driver: bridge

volumes:
  # Kept so `docker volume ls` / rollback still see the previous cluster (not mounted).
  finance_pg_data:
  finance_pg_data_v2:
  kafka_data:
  opensearch_data:
  frontend_web_node_modules:

