server:
  port: 8086

spring:
  application:
    name: notification-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/finance}
    username: ${SPRING_DATASOURCE_USERNAME:finance}
    password: ${SPRING_DATASOURCE_PASSWORD:123456}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    table: notification_flyway_schema_history
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: kafka:9092
    listener:
      observation-enabled: true
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${SMTP_USERNAME}
    password: ${SMTP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: http://jaeger:4318/v1/traces

services:
  finance-api:
    base-url: ${FINANCE_API_BASE_URL:http://localhost:8080}

notification:
  mail:
    from: ${NOTIFICATION_MAIL_FROM:${SMTP_USERNAME:}}
    portal-public-url: ${APP_PORTAL_PUBLIC_URL:http://localhost:5173}
  insight:
    aggregation-interval-ms: ${NOTIFICATION_INSIGHT_AGGREGATION_INTERVAL_MS:21600000}