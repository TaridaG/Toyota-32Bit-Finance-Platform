spring:
  application:
    name: analytics-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/finance}
    username: ${SPRING_DATASOURCE_USERNAME:finance}
    password: ${SPRING_DATASOURCE_PASSWORD:123456}

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    listener:
      ack-mode: record
    consumer:
      group-id: analytics-service
      auto-offset-reset: earliest
      enable-auto-commit: false
      max-poll-records: 100
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
        spring.json.use.type.headers: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: analytics-service

clients:
  finance:
    base-url: ${FINANCE_BASE_URL:http://finance-api:8080}
    auth:
      mode: ${CLIENTS_FINANCE_AUTH_MODE:header}
      header-username: ${CLIENTS_FINANCE_HEADER_USERNAME:analytics-service}
      bearer-token: ${CLIENTS_FINANCE_BEARER_TOKEN:}

analytics:
  processing:
    policy-enforced: ${ANALYTICS_PROCESSING_POLICY_ENFORCED:true}
  features:
    enabled: ${ANALYTICS_FEATURES_ENABLED:true}

notification:
  insight:
    threshold: ${NOTIFICATION_INSIGHT_THRESHOLD:0.08}