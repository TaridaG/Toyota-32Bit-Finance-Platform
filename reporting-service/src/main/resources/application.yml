spring:
  config:
    import: optional:classpath:application-openapi.yml
  application:
    name: reporting-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/finance}
    username: ${SPRING_DATASOURCE_USERNAME:finance}
    password: ${SPRING_DATASOURCE_PASSWORD:123456}

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    listener:
      ack-mode: record
    consumer:
      auto-offset-reset: earliest
      enable-auto-commit: false

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%X{correlationId}] %-5level %logger - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: reporting-service
reporting:
  scheduler:
    fixed-delay-ms: ${REPORTING_SCHEDULER_FIXED_DELAY_MS:60000}

storage:
  url: ${MINIO_URL:http://minio:9000}
  access-key: ${MINIO_ACCESS_KEY:minio}
  secret-key: ${MINIO_SECRET_KEY:minio123}
  bucket: reports

clients:
  analytics:
    base-url: ${ANALYTICS_BASE_URL:http://analytics-service:8080}
  finance:
    base-url: ${FINANCE_BASE_URL:http://finance-api:8080}
    auth:
      mode: ${CLIENTS_FINANCE_AUTH_MODE:header}
      header-username: ${CLIENTS_FINANCE_HEADER_USERNAME:reporting-service}
      bearer-token: ${CLIENTS_FINANCE_BEARER_TOKEN:}