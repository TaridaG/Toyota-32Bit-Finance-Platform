name: deploy-ec2

on:
  workflow_run:
    workflows: [docker-verify]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      services:
        description: 'Comma-separated compose service names (empty = detect from latest main commit)'
        required: false
        default: ''

concurrency:
  group: deploy-ec2-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  changes:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    outputs:
      service_csv: ${{ steps.matrix.outputs.service_csv }}
      any_changed: ${{ steps.matrix.outputs.any_changed }}
    steps:
      - name: Check out triggering commit
        if: github.event_name != 'workflow_dispatch'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Check out main
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch main for path comparison
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.services == ''
        run: git fetch origin main:refs/remotes/origin/main --depth=64

      - name: Resolve path filter refs
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.services == ''
        id: filter_refs
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "ref=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
            echo "base=main" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${{ github.sha }}" >> "$GITHUB_OUTPUT"
            echo "base=$(git rev-parse "${{ github.sha }}^")" >> "$GITHUB_OUTPUT"
          fi

      - name: Detect changed Docker targets
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.services == ''
        id: filter
        uses: dorny/paths-filter@v3
        with:
          base: ${{ steps.filter_refs.outputs.base }}
          ref: ${{ steps.filter_refs.outputs.ref }}
          filters: |
            shared:
              - 'pom.xml'
              - 'Docker/docker-compose.yml'
              - 'Docker/application.yml'
              - '.github/workflows/deploy-ec2.yml'
            finance-api:
              - 'pom.xml'
              - 'finance-api/**'
              - 'finance-api/Dockerfile'
              - '.github/workflows/deploy-ec2.yml'
            market-data-service:
              - 'pom.xml'
              - 'market-data-service/**'
              - 'market-data-service/Dockerfile'
              - '.github/workflows/deploy-ec2.yml'
            api-gateway:
              - 'pom.xml'
              - 'api-gateway/**'
              - 'api-gateway/Dockerfile'
              - '.github/workflows/deploy-ec2.yml'
            news-service:
              - 'pom.xml'
              - 'news-service/**'
              - 'news-service/Dockerfile'
              - '.github/workflows/deploy-ec2.yml'
            notification-service:
              - 'pom.xml'
              - 'notification-service/**'
              - 'notification-service/Dockerfile'
              - '.github/workflows/deploy-ec2.yml'
            analytics-service:
              - 'pom.xml'
              - 'analytics-service/**'
              - 'analytics-service/Dockerfile'
              - '.github/workflows/deploy-ec2.yml'
            log-consumer-service:
              - 'pom.xml'
              - 'log-consumer-service/**'
              - 'log-consumer-service/Dockerfile'
              - '.github/workflows/deploy-ec2.yml'
            frontend-web:
              - 'frontend-web/**'
              - 'frontend-web/Dockerfile'
              - '.github/workflows/deploy-ec2.yml'

      - name: Build deploy service list
        id: matrix
        uses: actions/github-script@v7
        env:
          FILTERS_JSON: ${{ toJSON(steps.filter.outputs) }}
          MANUAL_SERVICES: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.services || '' }}
        with:
          script: |
            const all = [
              'finance-api',
              'market-data-service',
              'api-gateway',
              'news-service',
              'notification-service',
              'analytics-service',
              'log-consumer-service',
              'frontend-web'
            ];
            const manual = (process.env.MANUAL_SERVICES || '').trim();
            let list;
            if (manual) {
              list = manual.split(',').map((s) => s.trim()).filter(Boolean);
              const unknown = list.filter((s) => !all.includes(s));
              if (unknown.length > 0) {
                core.setFailed(`Unknown compose services: ${unknown.join(', ')}`);
                return;
              }
            } else {
              const filters = JSON.parse(process.env.FILTERS_JSON || '{}');
              if (filters.shared === 'true') {
                list = all;
              } else {
                list = all.filter((name) => filters[name] === 'true');
              }
            }
            core.setOutput('service_csv', list.join(','));
            core.setOutput('any_changed', list.length > 0 ? 'true' : 'false');

  deploy:
    name: deploy-ec2
    needs: changes
    if: needs.changes.outputs.any_changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Deploy changed services on EC2
        env:
          SERVICE_CSV: ${{ needs.changes.outputs.service_csv }}
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 80m
          script_stop: true
          envs: SERVICE_CSV
          script: |
            set -euo pipefail
            REPO_DIR="${REPO_DIR:-$HOME/Toyota-32Bit-Finance-Platform}"
            if [ ! -d "$REPO_DIR/.git" ]; then
              echo "Repository not found at $REPO_DIR — clone the repo on EC2 first."
              exit 1
            fi
            cd "$REPO_DIR"
            git fetch origin main
            git checkout main
            git pull --ff-only origin main
            cd Docker
            if [ -z "${SERVICE_CSV:-}" ]; then
              echo "No services to deploy."
              exit 1
            fi
            export DOCKER_BUILDKIT=1
            export COMPOSE_DOCKER_CLI_BUILD=1

            # Stop app tier + heavy infra before build (keeps postgres/redis up for data).
            # Frees RAM/CPU on small EC2 instances during npm/mvn Docker builds.
            STOP_FOR_BUILD=(
              frontend-web
              api-gateway
              finance-api
              market-data-service
              news-service
              notification-service
              analytics-service
              log-consumer-service
              kafka
              keycloak
              opensearch
              opensearch-dashboards
              jaeger
              prometheus
              grafana
            )
            echo "=== Stopping services before build (maintenance window) ==="
            docker compose stop "${STOP_FOR_BUILD[@]}" || true
            sleep 5
            free -h || true

            IFS=',' read -ra SVC <<< "${SERVICE_CSV}"
            echo "=== Building changed services: ${SVC[*]} ==="
            for s in "${SVC[@]}"; do
              echo "=== docker compose build ${s} ==="
              docker compose build "${s}"
            done

            echo "=== Starting full stack ==="
            docker compose up -d

            echo "=== Recreating deployed services ==="
            for s in "${SVC[@]}"; do
              docker compose up -d --force-recreate "${s}"
            done

            echo "=== Deploy finished ==="
            docker compose ps
