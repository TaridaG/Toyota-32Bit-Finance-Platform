name: pr-ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      modules: ${{ steps.matrix.outputs.modules }}
      any_changed: ${{ steps.matrix.outputs.any_changed }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed modules
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            finance-api:
              - 'pom.xml'
              - 'finance-api/**'
              - '.github/workflows/pr-ci.yml'
            market-data-service:
              - 'pom.xml'
              - 'market-data-service/**'
              - '.github/workflows/pr-ci.yml'
            api-gateway:
              - 'pom.xml'
              - 'api-gateway/**'
              - '.github/workflows/pr-ci.yml'
            news-service:
              - 'pom.xml'
              - 'news-service/**'
              - '.github/workflows/pr-ci.yml'
            notification-service:
              - 'pom.xml'
              - 'notification-service/**'
              - '.github/workflows/pr-ci.yml'
            analytics-service:
              - 'pom.xml'
              - 'analytics-service/**'
              - '.github/workflows/pr-ci.yml'
            log-consumer-service:
              - 'pom.xml'
              - 'log-consumer-service/**'
              - '.github/workflows/pr-ci.yml'

      - name: Build test matrix
        id: matrix
        uses: actions/github-script@v7
        env:
          FILTERS_JSON: ${{ toJSON(steps.filter.outputs) }}
        with:
          script: |
            const filters = JSON.parse(process.env.FILTERS_JSON);
            const modules = [
              {
                module: 'finance-api',
                wrapper: './finance-api/mvnw',
                pom: 'finance-api/pom.xml',
                reports: 'finance-api/target'
              },
              {
                module: 'market-data-service',
                wrapper: './market-data-service/mvnw',
                pom: 'market-data-service/pom.xml',
                reports: 'market-data-service/target'
              },
              {
                module: 'api-gateway',
                wrapper: './api-gateway/mvnw',
                pom: 'api-gateway/pom.xml',
                reports: 'api-gateway/target'
              },
              {
                module: 'news-service',
                wrapper: './news-service/mvnw',
                pom: 'news-service/pom.xml',
                reports: 'news-service/target'
              },
              {
                module: 'notification-service',
                wrapper: './notification-service/mvnw',
                pom: 'notification-service/pom.xml',
                reports: 'notification-service/target'
              },
              {
                module: 'analytics-service',
                wrapper: './analytics-service/mvnw',
                pom: 'analytics-service/pom.xml',
                reports: 'analytics-service/target'
              },
              {
                module: 'log-consumer-service',
                wrapper: './log-consumer-service/mvnw',
                pom: 'log-consumer-service/pom.xml',
                reports: 'log-consumer-service/target'
              }
            ].filter((entry) => filters[entry.module] === 'true');

            core.setOutput('modules', JSON.stringify(modules));
            core.setOutput('any_changed', modules.length > 0 ? 'true' : 'false');

  test-modules:
    name: test-${{ matrix.module }}
    needs: changes
    if: needs.changes.outputs.any_changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.modules) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Make Maven wrapper executable
        run: |
          if [ -f "${{ matrix.wrapper }}" ]; then
            chmod +x "${{ matrix.wrapper }}"
          fi

      - name: Run tests for ${{ matrix.module }}
        run: |
          if [ -f "${{ matrix.wrapper }}" ]; then
            "${{ matrix.wrapper }}" -B -ntp -f "${{ matrix.pom }}" test
          else
            mvn -B -ntp -f "${{ matrix.pom }}" test
          fi

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.module }}-test-reports
          path: |
            ${{ matrix.reports }}/surefire-reports/**
            ${{ matrix.reports }}/failsafe-reports/**
          if-no-files-found: ignore
